# Mosquitto MQTT Broker Configuration
# AscultiCor Local Development

# Listeners
# The raw MQTT listener is intended for local/private networks only. Keep the
# Docker port bound to 127.0.0.1 for cloud deployments unless MQTT is protected
# by TLS, a VPN, or another private network boundary.
listener 1883
protocol mqtt

# The production TLS listener is appended by entrypoint.sh only when the
# mounted certificate and private key are available.

listener 9001
protocol websockets

# Authentication — each device should have its own MQTT credentials
# The entrypoint.sh creates a shared user; for production, generate
# per-device users via mosquitto_passwd -b /mosquitto/config/passwd <user> <pass>
allow_anonymous false
password_file /mosquitto/config/passwd

# Access Control — restrict devices to their own topic namespace
acl_file /mosquitto/config/acl

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# Connection limits
# Capped at 500 to prevent resource exhaustion. Each device uses 1 connection.
# Increase if you have more than 500 devices.
max_connections 500
max_queued_messages 1000

# Max packet size (2MB: 4x safety margin over a 10s PCG chunk at 22050 Hz/int16 ≈ 441 KB)
# Reduced from 10MB to limit MQTT flood attack damage.
max_packet_size 2097152

# Quality of Service
max_qos 2
